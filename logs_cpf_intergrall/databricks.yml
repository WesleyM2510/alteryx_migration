# Databricks Asset Bundle — Logs CPF Intergrall VF1
#
# Substitui o agendamento do Alteryx Designer/Server para o indicador de auditoria
# contínua migrado de `Logs CPF Intergrall VF1.yxmd`.
#
# Deploy:
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run logs_cpf_intergrall -t dev
#
# Em `mode: development` o job é prefixado com `[dev <user>]` e o **schedule fica
# pausado automaticamente** — deploy em dev não dispara execução agendada.

bundle:
  name: bmg-logs-cpf-intergrall

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog do indicador
    default: dtlk-sandbox
  bronze_schema:
    description: Schema Bronze (raw)
    default: micracao_alteryx
  silver_schema:
    description: Schema Silver (cleansed)
    default: micracao_alteryx
  gold_schema:
    description: Schema Gold (indicador)
    default: micracao_alteryx

  log_input_table:
    description: Tabela fonte do log Intergrall (leitura direta)
    default: "`dtlk-sandbox`.micracao_alteryx.cat099_log_itgl"
  rh_input_path:
    description: Base de RH (.xlsx) — abas Ativos e DesligadosConsolidado
    default: /Volumes/dtlk-sandbox/micracao_alteryx/excel_files/Base IGI RH.XLSX
  target_volume:
    description: Raiz do .xlsx datado (Resultado/<Ano>/<Mês>/dd-MM-yyyy.xlsx)
    default: /Volumes/dtlk-sandbox/micracao_alteryx/excel_files
  baseline_path:
    description: >-
      .xlsx de saída do Alteryx para validação de paridade. Vazio = validação por
      profiling + invariantes apenas (risco documentado, ver README).
    default: ""
  date_filter:
    description: >-
      Controla o escopo temporal do Silver. "recent" = mês corrente apenas
      (default para execução diária). "full" = todo o histórico (backfill).
    default: recent

  notification_email:
    description: Destinatário das notificações (substitui o Email tool + AfterError)
#    default: auditoria.continua@bancobmg.com.br
    default: wesleymaciel1@live.com

  # A auditoria roda de manhã; o recorte do indicador é ">= ontem".
  schedule_cron:
    description: Quartz cron do agendamento diário
    default: "0 0 6 * * ?"
  schedule_timezone:
    default: America/Sao_Paulo

  # SQL Alert — e-mail customizado com a contagem (o job usa template fixo).
  warehouse_id:
    description: >-
      SQL Warehouse que avalia o alert. Troque por `lookup: {warehouse: "<nome>"}`
      para resolver por nome em vez de ID.
    default: "529951f1ded20b7c"
  alert_cron:
    description: >-
      Cron do alert. 1h depois do job para dar folga às 4 tarefas — ver README
      sobre acoplar ao job em vez de usar cron.
    default: "0 0 7 * * ?"
  alert_pause_status:
    description: UNPAUSED | PAUSED — o alert não herda a pausa do mode:development
    default: PAUSED

targets:
  dev:
    default: true
    mode: development
    # workspace:
    #   profile: <seu-profile>          # ex.: e2_field_eng
    variables:
      catalog: dtlk-sandbox
      log_input_table: "`dtlk-sandbox`.micracao_alteryx.cat099_log_itgl"
      rh_input_path: /Volumes/dtlk-sandbox/micracao_alteryx/excel_files/Base IGI RH.XLSX
      target_volume: /Volumes/dtlk-sandbox/micracao_alteryx/excel_files
      notification_email: ${workspace.current_user.userName}
      alert_pause_status: PAUSED

  prod:
    mode: production
    # workspace:
    #   profile: <profile-prod>
    #   root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    # run_as:
    #   service_principal_name: <sp-application-id>   # recomendado em prod
    variables:
      catalog: dtlk-sandbox
      notification_email: auditoria.continua@bancobmg.com.br
      alert_pause_status: UNPAUSED
